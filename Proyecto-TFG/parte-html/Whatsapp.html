<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../parte-css/Whatsapp.css">
    <script src="../parte-logica/index.js"></script>
</head>
<body>
    <div class="whatsapp-container">
    <div class="whatsapp-card" id="whatsappCard">
        <div class="card-header">
            <span>¿Necesitas ayuda?</span>
            <button class="wa-close" onclick="toggleWhatsapp()">x</button>
        </div>
        <div class="card-body">
            <p><strong>¡Hola! 👋</strong></p>
            <p>¿Buscas apoyo escolar o información sobre nuestros servicios?</p>
            <p>En nuestra academia ayudamos a alumnos de Primaria, ESO y Bachillerato a mejorar sus notas y lograr sus objetivos.</p>
            <p>Cuéntanos qué asignatura se le resiste y te informamos sin compromiso. 📚✨</p>
            <a href="https://wa.me/1234567890" target="_blank" class="send-btn">
                Abrir chat
            </a>
        </div>
    </div>

    <button class="whatsapp-button" onclick="toggleWhatsapp()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
    </button>
</div>
</body>
</html>
